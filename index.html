<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Report Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: black;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafafa;
            line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Astrology Report Generator</h1>
    <p class="subtitle">Get your Career, Wealth, Marriage & Life Forecast</p>

    <form id="astroForm">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Time of Birth</label>
        <input type="time" id="tob" required>

        <label>Place of Birth</label>
        <input type="text" id="pob" placeholder="Enter birth place" required>

        <button type="submit">Generate Full Astrology Report</button>
    </form>

    <div id="result"></div>
</div>

<script>
document.getElementById("astroForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const resultBox = document.getElementById("result");

    const formData = {
        fullName: document.getElementById("fullName").value,
        dob: document.getElementById("dob").value,
        tob: document.getElementById("tob").value,
        pob: document.getElementById("pob").value
    };

    resultBox.innerHTML = "Generating your astrology report...";

    try {
        const response = await fetch("https://astrology-website-7839.onrender.com/generate-report", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
        });

        const data = await response.json();
if (data.success) {
    const formattedReport = data.report
        .replace(/\n/g, "<br><br>")
        .replace(/•/g, "<br>• ");

    resultBox.innerHTML = `
        <h2 style="margin-bottom:15px;">Your Full Astrology Report</h2>
        <div style="
            background:#fff;
            padding:20px;
            border-radius:12px;
            line-height:1.8;
            font-size:16px;
            color:#333;
        ">
            ${formattedReport}
        </div>
    `;
} else {
    resultBox.innerHTML = `Server Error: ${data.error}`;
}
    } catch (error) {
        resultBox.innerHTML = `Error: ${error.message}`;
    }
});
</script>

</body>
</html>
```
