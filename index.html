```html
<form id="astroForm">
    <input type="text" id="fullName" placeholder="Full Name" required>

    <input type="date" id="dob" required>

    <input type="time" id="tob" required>

    <input type="text" id="pob" placeholder="Place of Birth" required>

    <button type="submit">Generate Report</button>
</form>

<div id="result"></div>

<script>
document.getElementById("astroForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const resultBox = document.getElementById("result");

    const formData = {
        fullName: document.getElementById("fullName").value,
        dob: document.getElementById("dob").value,
        tob: document.getElementById("tob").value,
        pob: document.getElementById("pob").value
    };

    resultBox.innerHTML = "Generating report...";

    try {
        const response = await fetch("https://astrology-website-7839.onrender.com/generate-report", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
            resultBox.innerHTML = `<h3>Your Report</h3><p>${data.report}</p>`;
        } else {
            resultBox.innerHTML = `Error: ${data.error}`;
        }

    } catch (error) {
        resultBox.innerHTML = `Error: ${error.message}`;
    }
});
</script>
```
